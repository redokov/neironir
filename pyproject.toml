[project]
name = "neironir"
version = "0.0.1"
description = "Local web service for redacting personal data from text documents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "itsdangerous>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "coverage>=7.5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/neironir"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_model: integration tests that require a real OPF subprocess. Skipped unless the OPF binary is on PATH and NEIRONIR_RUN_REAL_MODEL_TESTS=1.",
]

[tool.coverage.run]
source = ["backend/neironir"]
omit = [
  "backend/neironir/__init__.py",
  "backend/neironir/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "privacy-filter",
    "frontend",
    "storage",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 trips on FastAPI's ``Depends(...)`` / ``File(...)`` /
# ``BackgroundTasks(...)`` defaults — the framework's documented
# dependency-injection pattern is exactly this syntax, so we silence
# it here.
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/neironir"]
exclude = ["privacy-filter/.*"]
